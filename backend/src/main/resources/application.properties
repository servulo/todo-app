# DataSource SQL Server
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${DB_USER:sa}
quarkus.datasource.password=${DB_PASSWORD:YourStrong@Passw0rd}
quarkus.datasource.jdbc.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:tododb};encrypt=false

# Hibernate
quarkus.hibernate-orm.database.generation=update

# JWT — RSA public key from auth-app
# In production, override with: mp.jwt.verify.publickey.location=file:/path/to/publickey.pem
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY:}
mp.jwt.verify.issuer=${JWT_ISSUER:http://auth-app}

# Logging JSON (disable in test profile)
quarkus.log.console.json=true
%test.quarkus.log.console.json=false

# OpenAPI
quarkus.smallrye-openapi.info-title=Todo App API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for task management

# HTTP
quarkus.http.port=8080
